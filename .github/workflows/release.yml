name: ReleaseOrVersionPR

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release and changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Publishing uses npm Trusted Publishing (OIDC via `id-token: write`),
      # not a token. It needs npm >= 11.5.1, so pin Node 24 and update npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun --bun run check
      - run: bun --bun run check-types
      - run: bun run build
      - run: bun --bun run test

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: bun run release
          version-script: bun run version
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
